[package]
name = "echoport-slint-prototype"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
slint = "1.18"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
