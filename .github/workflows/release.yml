name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Release policy (v0.3.1+):
#   Windows: one Full setup.exe + one Lean setup.exe
#   Linux:   one Full tar.gz + one Lean tar.gz
#   Source:  GitHub's automatic source tarball/zip
# No MSI/zip/pacman/macOS assets are published by CI.
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb1-dev libx11-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb1-dev libx11-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and package Full
        run: |
          chmod +x scripts/build.sh scripts/package-linux.sh
          ./scripts/package-linux.sh
      - name: Build and package Lean
        run: ./scripts/package-linux.sh --lean
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/echoport-*-linux-x86_64.tar.gz*
            dist/echoport-*-linux-x86_64-lean.tar.gz*

  windows-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross + NSIS tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 nsis nsis-common unzip
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Cross-build Full and Lean Windows binaries
        run: |
          cargo build --release --locked --target x86_64-pc-windows-gnu
          cargo build --profile lean --no-default-features --locked --target x86_64-pc-windows-gnu
      - name: Fetch bundled media tools (Windows binaries)
        run: |
          mkdir -p .win-tools
          curl -L --fail -o .win-tools/yt-dlp.exe 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe'
          curl -L --fail -o ffmpeg.zip 'https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-lgpl.zip'
          unzip -q ffmpeg.zip -d .win-ffmpeg
          cp "$(find .win-ffmpeg -iname ffmpeg.exe | head -1)" .win-tools/ffmpeg.exe
          find .win-ffmpeg -maxdepth 2 \( -iname 'LICENSE*' -o -iname 'COPYING*' \) | head -1 | xargs -r -I{} cp '{}' .win-tools/LICENSE-ffmpeg.txt
          curl -L --fail -o .win-tools/LICENSE-yt-dlp.txt 'https://raw.githubusercontent.com/yt-dlp/yt-dlp/master/LICENSE'
          cp packaging/windows/THIRD-PARTY.md .win-tools/
      - name: Build Full setup.exe
        run: |
          chmod +x scripts/package-nsis.sh
          ./scripts/package-nsis.sh \
            --exe target/x86_64-pc-windows-gnu/release/echoport.exe \
            --tools-dir .win-tools
      - name: Build Lean setup.exe
        run: |
          ./scripts/package-nsis.sh \
            --exe target/x86_64-pc-windows-gnu/lean/echoport.exe \
            --tools-dir .win-tools --lean
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            dist/echoport-*-windows-x86_64-setup.exe*
            dist/echoport-*-windows-x86_64-lean-installer.exe*

  release:
    needs: [quality, linux, windows-setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Remove legacy release assets (keep only four packages + checksums)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          tag="${GITHUB_REF_NAME}"
          rel=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag") || exit 0
          ids=$(printf '%s' "$rel" | jq -r '
            .assets[]
            | select(.name | test("echoport-.*-((windows-x86_64-setup|windows-x86_64-lean-installer)[.]exe|linux-x86_64(-lean)?[.]tar[.]gz)([.]sha256)?$") | not)
            | .id')
          for id in $ids; do
            curl -fsSL -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id"
          done
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

      - name: Publish Gitee Release (assets only)
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          owner="${GITEE_OWNER:-nilotoo_art}"
          repo="${GITEE_REPO:-echo-port}"
          if [ -z "${GITEE_TOKEN:-}" ]; then
            echo "::notice::GITEE_TOKEN is not configured; skipping Gitee mirror."
            exit 0
          fi

          api="https://gitee.com/api/v5/repos/${owner}/${repo}"
          release_json=$(curl -fsS -X POST "${api}/releases"             --data-urlencode "access_token=${GITEE_TOKEN}"             --data-urlencode "tag_name=${TAG}"             --data-urlencode "name=EchoPort ${TAG}"             --data-urlencode "target_commitish=main"             --data-urlencode "body=EchoPort release ${TAG}") || true
          release_id=$(printf '%s' "${release_json}" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))' 2>/dev/null || true)
          if [ -z "${release_id}" ]; then
            releases_json=$(curl -fsS "${api}/releases?access_token=${GITEE_TOKEN}&per_page=100")
            release_id=$(printf '%s' "${releases_json}" | TAG="${TAG}" python3 -c 'import json,os,sys; tag=os.environ["TAG"]; print(next((r.get("id","") for r in json.load(sys.stdin) if r.get("tag_name")==tag),""))' 2>/dev/null || true)
          fi
          if [ -z "${release_id}" ]; then
            echo "::error::Could not create or find Gitee release ${TAG}"
            exit 1
          fi

          failed=0
          while IFS= read -r -d '' file; do
            echo "Uploading $(basename "$file") to Gitee ${TAG}"
            if ! curl -fsS -X POST "${api}/releases/${release_id}/attach_files"               -F "access_token=${GITEE_TOKEN}"               -F "file=@${file}"; then
              echo "::warning::Failed to upload ${file} to Gitee"
              failed=1
            fi
          done < <(find artifacts -type f \( -name '*.exe' -o -name '*.tar.gz' -o -name '*.tar.gz.sha256' -o -name '*.exe.sha256' \) -print0)
          if [ "${failed}" -ne 0 ]; then
            exit 1
          fi
