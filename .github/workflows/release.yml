name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Release policy (v0.3.1+):
#   Windows: one Full setup.exe + one Lean setup.exe
#   Linux:   one Full tar.gz + one Lean tar.gz
#   Source:  GitHub's automatic source tarball/zip
# No MSI/zip/pacman/macOS assets are published by CI.
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libxkbcommon-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxcb1-dev libx11-dev libxi-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and package Full
        run: |
          chmod +x scripts/build.sh scripts/package-linux.sh
          ./scripts/package-linux.sh
      - name: Build and package Lean
        run: ./scripts/package-linux.sh --lean
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/echoport-*-linux-x86_64.tar.gz*
            dist/echoport-*-linux-x86_64-lean.tar.gz*

  windows-setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cross + NSIS tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mingw-w64 nsis nsis-common unzip
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Cross-build Full and Lean Windows binaries
        run: |
          cargo build --release --locked --target x86_64-pc-windows-gnu
          cargo build --profile lean --no-default-features --locked --target x86_64-pc-windows-gnu
      - name: Fetch bundled media tools (Windows binaries)
        run: |
          mkdir -p .win-tools
          curl -L --fail -o .win-tools/yt-dlp.exe 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe'
          curl -L --fail -o ffmpeg.zip 'https://github.com/BtbN/FFmpeg-Builds/releases/latest/download/ffmpeg-master-latest-win64-lgpl.zip'
          unzip -q ffmpeg.zip -d .win-ffmpeg
          cp "$(find .win-ffmpeg -iname ffmpeg.exe | head -1)" .win-tools/ffmpeg.exe
          find .win-ffmpeg -maxdepth 2 \( -iname 'LICENSE*' -o -iname 'COPYING*' \) | head -1 | xargs -r -I{} cp '{}' .win-tools/LICENSE-ffmpeg.txt
          curl -L --fail -o .win-tools/LICENSE-yt-dlp.txt 'https://raw.githubusercontent.com/yt-dlp/yt-dlp/master/LICENSE'
          cp packaging/windows/THIRD-PARTY.md .win-tools/
      - name: Build Full setup.exe
        run: |
          chmod +x scripts/package-nsis.sh
          ./scripts/package-nsis.sh \
            --exe target/x86_64-pc-windows-gnu/release/echoport.exe \
            --tools-dir .win-tools
      - name: Build Lean setup.exe
        run: |
          ./scripts/package-nsis.sh \
            --exe target/x86_64-pc-windows-gnu/lean/echoport.exe \
            --tools-dir .win-tools --lean
      - uses: actions/upload-artifact@v4
        with:
          name: windows-setup
          path: |
            dist/echoport-*-windows-x86_64-setup.exe*
            dist/echoport-*-windows-x86_64-lean-setup.exe*

  release:
    needs: [linux, windows-setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Remove legacy release assets (keep only four packages + checksums)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          tag="${GITHUB_REF_NAME}"
          rel=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$tag") || exit 0
          ids=$(printf '%s' "$rel" | jq -r '
            .assets[]
            | select(.name | test("echoport-.*-(windows-x86_64(-lean)?-setup[.]exe|linux-x86_64(-lean)?[.]tar[.]gz)([.]sha256)?$") | not)
            | .id')
          for id in $ids; do
            curl -fsSL -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$id"
          done
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
