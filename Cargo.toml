[package]
name = "echoport"
version = "0.3.0"
edition = "2021"
repository = "https://github.com/Nilotoo/EchoPort"
homepage = "https://github.com/Nilotoo/EchoPort"
description = "EchoPort - a lightweight, privacy-first cross-platform music player"
license = "GPL-3.0-only"

[dependencies]
# GUI: glow (OpenGL) backend keeps it light; no wgpu/webview.
eframe = { version = "0.32", default-features = false, features = [
    "glow", "default_fonts", "wayland", "x11",
] }
egui = "0.32"

# audio engine
cpal = { version = "0.18", default-features = false }
symphonia = { version = "0.6", features = ["aac", "mp3", "isomp4", "alac", "flac", "wav", "pcm", "ogg", "vorbis"] }
lofty = "0.25"

# networking / persistence / misc (ureq: blocking, light, no tokio)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
crossbeam-channel = "0.5"
dirs = "7"
url = "2"
sha2 = "0.11"
rfd = "0.17"
open = "5"
log = "0.4"
env_logger = "0.11"

# media/image
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
ureq = { version = "3.5.0", features = ["json"] }
ringbuf = "0.5.3"
walkdir = "2.5.0"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
base64 = "0.23.1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
